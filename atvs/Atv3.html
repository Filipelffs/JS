<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>
</head>

<body>

    <script>

        let a = 5;
        let b = 7;

        console.log("O primeiro numero é " + a);
        console.log("O segundo numero é " + b);

        let soma = a + b;
        let subtracao = a - b;
        let multiplicacao = a * b;
        let divisao = a / b;

        console.log("A soma dos numeros é: " + soma);
        console.log("A subtração dos numeros é: " + subtracao);
        console.log("A multiplicação dos numeros é: " + multiplicacao);
        console.log("A divisão dos numeros é: " + divisao);

        if (a > b) {
            console.log("O primeiro valor é maior que o segundo");
        }
        if (a == b) {
            console.log("O primeiro valor é igual ao segundo");
        }
        if (a < b) {
            console.log("O primeiro valor é menor que o segundo");
        }
        else {
            console.log("ERRO")
        }

        a++;
        b--;

        console.log(a);
        console.log(b);

    </script>

</body>

</html>
