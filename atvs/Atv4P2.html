<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4</title>
</head>
<body>
    <script>

        let nota = Number(prompt("Digite uma nota: "))
        
        if(nota >= 7){
            console.log("Aprovado");
        } 
        if (nota >= 5 && nota < 7){
            console.log("Recuperação");
        }
        if (nota < 5) {
            console.log("Reprovado");
        }
    </script>
</body>
</html>
