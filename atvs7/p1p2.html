<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade parte 1</title>
</head>
<body>
    <h1 id="titulo">Minha Página</h1>
    <button onclick="mudarTexto()">Enviar</button>

    <script>
        function mudarTexto() {
            document.getElementById('titulo').textContent = 'Bem-vindo ao JavaScript!';
            document.getElementById('titulo').style.color = 'blue';
            document.getElementById('titulo').style.fontSize = '30px';
        }
    </script>
</body>
</html>
