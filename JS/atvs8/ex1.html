<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 8</title>
</head>
<body>

    <!--Parte 1 - onclick -->

    <button onclick="mudarTexto()">Enviar</button>
    <br>
    <br>
    
    <!--Parte 2 - onkeyup -->
    
    <input type="text" id="texto" placeholder="Digitar" onkeyup="Tempo()">
    <br>
    <br>
    
    <!--Parte 3 - change-->
    
    <select id="Selecionar" onchange="EscolherCurso()">
        <option>Informartica</option>
        <option>Agropecuaria</option>
        <option>Edificações</option>
    </select>
    <br>
    <br>
    
    <!--Parte 4 - submit-->
    
    <form onsubmit="return ValidarFormulario()">
        <label>Nome</label>
        <input type="text" id="nome">
        <label>Email</label>
        <input type="email" id="email">
        <button type="submit">Cadastrar</button>
    </form>
    <script>
        function mudarTexto() {
            alert('Bem-vindo ao JavaScript!');
        }

        function Tempo() {
            let texto = document.getElementById("texto").value;
            console.log(texto);
        }        
        function EscolherCurso(){
            let curso = document.getElementById("curso").value;
            
            if(curso !== ""){
                alert("Curso Escolhido: " + curso);
            }
        }
        function ValidarFormulario(){
            let nome = document.getElementById("nome").value;
            let email = document.getElementById("email").value;
    
            if (nome ==="" || email===""){
                alert("Preencha o espaço vazio");
                return false;
            }

            alert("Cadastro realizado com sucesso!");
            return true;
        }
    </script>
</body>
</html>
