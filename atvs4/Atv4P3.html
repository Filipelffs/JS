<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4</title>
</head>
<body>
    <script>

        let dia = Number(prompt("Digite o dia:"))
        
        switch(dia){
        case 1:
            console.log("Segunda");
        break; 
        case 2:
            console.log("Terça");
        break; 
        case 3:
            console.log("Quarta");
        break; 
        case 4:
            console.log("Quinta");
        break; 
        case 5:
            console.log("Sexta");
        break; 
        case 6:
            console.log("Sábado");
        break; 
        case 7:
            console.log("Domingo");
        break;
        default:
            console.log("Dia inválido")
        }
    </script>
</body>
</html>
